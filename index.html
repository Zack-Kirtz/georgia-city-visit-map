<!DOCTYPE html>
<html>
<head>
<body>
<script>

const SUPABASE_URL = 'https://foshraaftkinhnnchnwf.supabase.co';
const SUPABASE_ANON_KEY = 'sb_secret_nkdOSSCzHVsbk4FbxGqK0w_ASDCHqAK';

const supabase = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

let map;
let geojsonLayer;
let selectedFeature = null;
let currentFilter = 'all';
let cityData = {};

async function loadVisitData() {

  const { data, error } = await supabase
    .from('city_visits')
    .select('*');

  if (error) {
    console.error('Supabase Load Error:', error);
    return;
  }

  data.forEach(row => {

    cityData[row.city_name] = {
      visited: row.visited || 'No',
      visit_date: row.visit_date || '',
      notes: row.notes || '',
      photo: row.photo_url || ''
    };

  });

  renderLayer(GEOJSON);
  updateStats();
}

function initMap() {

  map = L.map('map', {
    zoomControl: true,
    center: [32.8, -83.2],
    zoom: 7,
    minZoom: 6,
    maxZoom: 14
  });

  L.tileLayer(
    'https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png',
    {
      attribution: '© OpenStreetMap © CARTO',
      subdomains: 'abcd',
      maxZoom: 19
    }
  ).addTo(map);

  GEOJSON.features.forEach(feature => {

    const p = feature.properties;

    if (!cityData[p.name]) {

      cityData[p.name] = {
        visited: 'No',
        visit_date: '',
        notes: '',
        photo: '',
        acres: p.acres || 0,
        centroid_lat: p.centroid_lat,
        centroid_lng: p.centroid_lng
      };

    }

  });

}

function renderLayer(gj) {

  if (geojsonLayer) {
    map.removeLayer(geojsonLayer);
  }

  const filtered = {
    ...gj,
    features: gj.features.filter(feature => {

      const city = cityData[feature.properties.name];
      const visited = city?.visited === 'Yes';

      if (currentFilter === 'visited') {
        return visited;
      }

      if (currentFilter === 'unvisited') {
        return !visited;
      }

      return true;
    })
  };

  geojsonLayer = L.geoJSON(filtered, {

    style: getStyle,

    onEachFeature: function(feature, layer) {

      const cityName = feature.properties.name;

      layer.on({

        mouseover: function(e) {

          if (cityData[cityName]?.visited !== 'Yes') {

            e.target.setStyle({
              fillOpacity: 0.6,
              weight: 2
            });

          }

        },

        mouseout: function(e) {
          geojsonLayer.resetStyle(e.target);
        },

        click: function() {
          openSidebar(cityName, feature);
        }

      });

      layer.bindTooltip(cityName, {
        sticky: true
      });

    }

  }).addTo(map);

}

function openSidebar(name, feature) {

  selectedFeature = {
    name,
    feature
  };

  const d = cityData[name];

  document.getElementById('sidebar-city').textContent = name;

  const badge = document.getElementById('sidebar-badge');
  const badgeText = document.getElementById('badge-text');

  if (d.visited === 'Yes') {

    badge.className = 'visited-badge';
    badgeText.textContent = 'Visited';

  } else {

    badge.className = 'unvisited-badge';
    badgeText.textContent = 'Not yet visited';

  }

  document.getElementById('edit-visited').value =
    d.visited || 'No';

  document.getElementById('edit-date').value =
    d.visit_date || '';

  document.getElementById('edit-notes').value =
    d.notes || '';

  document.getElementById('edit-photo').value =
    d.photo || '';

  updatePhotoPreview(d.photo);

  document.getElementById('sidebar')
    .classList.add('open');

}

async function saveCity() {

  if (!selectedFeature) {
    return;
  }

  const city = selectedFeature.name;

  const updatedData = {

    city_name: city,

    visited:
      document.getElementById('edit-visited').value,

    visit_date:
      document.getElementById('edit-date').value || null,

    notes:
      document.getElementById('edit-notes').value,

    photo_url:
      document.getElementById('edit-photo').value

  };

  const { error } = await supabase
    .from('city_visits')
    .upsert(updatedData, {
      onConflict: 'city_name'
    });

  if (error) {

    console.error(error);

    showToast('Save failed');

    return;

  }

  cityData[city] = {
    visited: updatedData.visited,
    visit_date: updatedData.visit_date,
    notes: updatedData.notes,
    photo: updatedData.photo_url
  };

  renderLayer(GEOJSON);

  updateStats();

  showToast('✓ Visit saved');

}

function getStyle(feature) {

  const d = cityData[feature.properties.name];

  const visited = d?.visited === 'Yes';

  return {

    fillColor:
      visited ? '#2d7a4a' : '#c8ddd4',

    fillOpacity:
      visited ? 0.8 : 0.6,

    color:
      visited ? '#1a5c32' : '#000000',

    weight: 2,

    opacity: 1

  };

}
